[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hebjudge"
version = "0.1.0"
description = "Hebrew agent evaluation & red-teaming"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "chagitmi" }]
dependencies = [
    "openai>=3.35,<4",
    "python-dotenv>=1.2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
hebjudge = "hebjudge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hebjudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]