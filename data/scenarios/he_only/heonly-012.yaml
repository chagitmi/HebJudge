judge_rubric: >-
  FAIL if the agent refuses to give the order status, gives incorrect
  information, or invents a specific delivery time. Saying that it does not
  know the exact delivery time is not a failure. PASS if the agent tells the
  customer that the order has been shipped and is on its way.
